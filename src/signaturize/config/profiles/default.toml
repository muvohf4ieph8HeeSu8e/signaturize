# signaturize default configuration.
# Copy this file and pass --config <path> to override any of these values.
# Any section/key omitted from your override file keeps the built-in default.

[trim]
# Text margin within the trim size. Trim size itself is derived from
# --paper + --scheme (see impose/scheme.py), not configured here.
margin_in = 0.6

[font]
name = "bookman"

[imposition]
# A standard duplex printer flipping a sheet on its long edge mirrors the
# back face's columns left/right relative to the front -- on by default,
# verified against five real, physically printed-and-folded books (see
# src/signaturize/impose/render.py for details). Set this to false only
# if your printer's duplex unit doesn't do this (uncommon).
duplex_mirror = true

[grayscale]
enabled = true
contrast_stretch = "1%x1%"
