[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signaturize"
version = "0.1.0"
description = "Turn epubs into print-ready saddle-stitch pamphlet booklets"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "lxml",
]

[project.scripts]
signaturize = "signaturize.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
